<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G_Outdoor | Alat</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <div style="display: flex; gap: 0.5rem;">
            <div class="img">
                <img src="../assets/img/logo.png" alt="logo">
            </div>
            <h1>G_Outdoor</h1>
        </div>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Alat</a></li>
                <li><a href="../penyewa/list.html">Daftar Penyewa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Alat</h2>
            <form id="form-tambah" action="" novalidate>
                <p>
                    <label for="nama">Nama</label>
                    <input type="text" id="judul" name="nama" required>
                </p>
                <p>
                    <label for="merk">Merk</label>
                    <input type="text" id="merk" name="merk" required>
                </p>
                <p>
                    <label for="harga">Harga</label>
                    <input type="number" id="harga" name="harga"required>
                </p>
                <p>
                    <label for="total_stok">Total Stok</label>
                    <input type="text" id="total_stok" name="total_stok" required>
                </p>
                <p>
                    <label for="stok_tersedia">Stok Tersedia</label>
                    <input type="number" id="stok_tersedia" name="stok_tersedia" min="0" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label>
                    <select name="kategori" id="kategori">
                        <option value="fiksi">Trekking</option>
                        <option value="non-fiksi">Shelter</option>
                        <option value="referensi">Cooking</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 G_Outdoor</p>
    </footer>
    <script type="module" src="../assets/js/app.js"></script>
</body>

</html>
