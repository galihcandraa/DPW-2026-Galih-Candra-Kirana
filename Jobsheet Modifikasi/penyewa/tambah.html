<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G_Outdoor | Penyewa</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <div style="display: flex; gap: 0.5rem;">
            <div class="img">
                <img src="../assets/img/logo.png" alt="logo">
            </div>
            <h1>G_Outdoor</h1>
        </div>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../alat/list.html">Daftar Alat</a></li>
                <li><a href="list.html">Daftar Penyewa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Penyewa</h2>
            <form id="form-tambah" novalidate>
                <p>
                    <label for="nama">Nama</label>
                    <input type="text" id="judul" name="nama" required>
                </p>
                <p>
                    <label for="no_anggota">No. Anggota</label>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="alamat">alamat</label>
                    <input type="test" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No. HP</label>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 G_Outdoor</p>
    </footer>
    <script type="module" src="../assets/js/app.js"></script>
</body>

</html>
